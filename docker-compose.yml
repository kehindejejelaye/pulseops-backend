services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseops-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pulseops
    ports:
      - "5433:5432" # Exposed on 5433 to avoid conflicts with any other local postgres
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulseops"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseops-backend-app
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      APP_VERSION: 1.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: pulseops
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net

volumes:
  backend_postgres_data:

networks:
  backend-net:
    driver: bridge
